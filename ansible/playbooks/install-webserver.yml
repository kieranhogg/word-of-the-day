---
- name: Deploy Frontend and Web Server
  hosts: all
  become: true

  tasks:
    - name: Install Caddy dependencies
      apt:
        name: ["debian-keyring", "debian-archive-keyring", "apt-transport-https"]
        state: present
        update_cache: true

    - name: Ensure keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Caddy signing key
      ansible.builtin.get_url:
        url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
        dest: /etc/apt/keyrings/caddy-stable.asc
        mode: '0644'

    - name: Add Caddy apt repo
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/caddy-stable.asc] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main"
        filename: caddy-stable
        state: present

    - name: Install Caddy Engine
      apt:
        name: caddy
        state: present
        update_cache: true

    - name: Ensure web root directory exists
      file:
        path: /var/www/frontend
        state: directory
        owner: caddy
        group: caddy
        mode: '0755'

    - name: Copy frontend static files to server
      copy:
        src: ../../frontend/
        dest: /var/www/frontend/
        owner: caddy
        group: caddy
        mode: '0644'

    - name: Copy Caddyfile configuration
      copy:
        src: "{{ env_caddyfile }}"
        dest: /etc/caddy/Caddyfile
      notify: Reload Caddy

  handlers:
    - name: Reload Caddy
      service:
        name: caddy
        state: reloaded