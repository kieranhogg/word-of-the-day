- name: Pull Docker Images
  hosts: all
  become: true
  tasks:
    - name: Pull the wotd image
      community.docker.docker_image:
        name: ghcr.io/kieranhogg/word-of-the-day
        tag: main
        source: pull
        force_source: true

    - name: Start wotd container
      community.docker.docker_container:
        name: api
        image: ghcr.io/kieranhogg/word-of-the-day:main
        state: started
        restart_policy: always
        ports:
          - "127.0.0.1:8000:8000"
