name: Deploy to Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 'Deploy'
    runs-on: ubuntu-latest
    environment: production
    strategy:
     matrix:
       environment: [production]

    defaults:
      run:
        shell: bash
        working-directory: terraform/${{ matrix.environment }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
        terraform_wrapper: false

    - name: Terraform Init
      run: terraform init

    - name: Terraform Plan
      run: terraform plan -input=false

    - name: Terraform Apply
      run: terraform apply -auto-approve -input=false

    - name: Write Ansible inventory
      run: terraform output -raw production_inventory > ../../ansible/production.ini

    - name: Install Ansible
      run: pip install ansible

    - name: Set up SSH key
      working-directory: ansible/
      env:
        PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$PROD_SSH_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        PROD_HOST=$(awk '/^\[production\]/{f=1;next}/^\[/{f=0}f && NF{print $1; exit}' ${{ matrix.environment }}.ini)
        ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts

    - name: Run playbook
      working-directory: ansible/
      run: ansible-playbook -i ${{ matrix.environment }}.ini deploy.yml
      env:
          ANSIBLE_HOST_KEY_CHECKING: "False"